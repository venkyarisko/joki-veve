<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Dashboard - Veve Services</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@800&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #0a0a0c;
            color: white;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            color: var(--primary);
            margin-bottom: 30px;
            text-align: center;
        }

        /* Tabs System */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: black;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .client-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .client-item {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1.5fr;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Application List */
        .app-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .app-name {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .app-game {
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .app-detail {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .app-link {
            color: #00f2ff;
            text-decoration: underline;
        }

        .app-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-delete { background: rgba(255, 50, 50, 0.2); color: #ff4444; }

        .client-item:last-child {
            border-bottom: none;
        }

        .client-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .client-badge-col {
            text-align: center;
        }

        .client-total {
            color: var(--primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            text-align: right;
        }

        .client-meta {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .discount-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tier-none { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.5); }
        .tier-5 { background: rgba(0, 255, 128, 0.2); color: #00ff80; border: 1px solid rgba(0, 255, 128, 0.3); }
        .tier-10 { background: rgba(0, 242, 255, 0.2); color: #00f2ff; border: 1px solid rgba(0, 242, 255, 0.3); }
        .tier-15 { background: rgba(112, 0, 255, 0.2); color: #7000ff; border: 1px solid rgba(112, 0, 255, 0.3); }
        .tier-20 { background: rgba(255, 0, 128, 0.2); color: #ff0080; border: 1px solid rgba(255, 0, 128, 0.3); }
        .tier-30 { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #000; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }

        .summary-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(0, 242, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        .stat-val {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-lbl {
            font-size: 0.8rem;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <a href="index.html" class="back-btn">← Back to Site</a>
        <h1>Veve Internal Control</h1>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('tracker')">Client Tracker</button>
            <button class="tab-btn" onclick="switchTab('partners')">Partner Applications</button>
            <button class="tab-btn" onclick="switchTab('promos')">Manage Promos</button>
        </div>

        <!-- TAB: Tracker -->
        <div id="tab-tracker" class="tab-content active">
            <div class="summary-stats">
                <div class="stat-box">
                    <span class="stat-lbl">Total Omzet (Testi)</span>
                    <span class="stat-val" id="total-revenue">Rp 0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-lbl">Total Client Unique</span>
                    <span class="stat-val" id="total-clients">0</span>
                </div>
            </div>

            <!-- Testing Firebase Section -->
            <div class="stats-card" style="margin-bottom: 30px;">
                <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--primary);">Add Testimonial</h2>
                <form id="testi-form" style="display: grid; gap: 15px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <input type="text" id="name" placeholder="Client Name" required style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;">
                        <select id="game" required style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;">
                            <option value="" disabled selected style="background: #1a1a1c;">Pilih Game</option>
                            <option value="Arknight Endfield" style="background: #1a1a1c;">Arknight Endfield</option>
                            <option value="Wuthering Waves" style="background: #1a1a1c;">Wuthering Waves</option>
                            <option value="Neverness to Everness" style="background: #1a1a1c;">NTE (Neverness to Everness)</option>
                        </select>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <input type="text" id="price" placeholder="Price (e.g. Rp 500.000)" required style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;">
                        <select id="status" style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;">
                            <option value="1" style="background: #1a1a1c;">Complete</option>
                            <option value="0" style="background: #1a1a1c;">On Process</option>
                        </select>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <input type="text" id="services" placeholder="Service Tags (Pisahkan koma)" required style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;">
                        <input type="text" id="image-url" placeholder="Image URL (Link Discord / Imgur)" style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;">
                    </div>
                    <button type="submit" id="submit-btn" style="padding: 12px; background: var(--primary); color: black; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">Send to Firebase</button>
                </form>
                <div id="form-msg" style="margin-top: 10px; font-size: 0.9rem; text-align: center;"></div>
            </div>

            <div class="stats-card">
                <div class="client-item" style="border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 10px; opacity: 0.8; font-size: 0.8rem; text-transform: uppercase; font-weight: 800; letter-spacing: 1px;">
                    <span>Nama Client</span>
                    <span style="text-align: center;">Status Diskon</span>
                    <span style="text-align: right;">Total Pengeluaran</span>
                </div>
                <ul class="client-list" id="client-list">
                    <!-- Data will be injected here -->
                </ul>
            </div>
        </div>

        <!-- TAB: Partners -->
        <div id="tab-partners" class="tab-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--primary);">Incoming Partner Applications</h2>
            <div id="partner-apps-list">
                <!-- Apps will be injected here -->
                <p style="text-align: center; opacity: 0.5; padding: 20px;">Fetching applications...</p>
            </div>
        </div>

        <!-- TAB: Promos -->
        <div id="tab-promos" class="tab-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--primary);">Promo & Discount Codes</h2>
            
            <div class="stats-card" style="margin-bottom: 30px;">
                <h3 style="font-size: 1rem; margin-bottom: 15px;">Create New Code</h3>
                <form id="promo-form" style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;">
                    <input type="text" id="promo-code" placeholder="CODE (e.g. VEVE-BEST)" required style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; text-transform: lowercase;">
                    <input type="number" id="promo-discount" placeholder="Discount %" required style="padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white;">
                    <button type="submit" style="background: var(--primary); color: black; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">Add Code</button>
                </form>
            </div>

            <div class="stats-card">
                <div class="client-item" style="border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 10px; opacity: 0.8; font-size: 0.8rem; text-transform: uppercase; font-weight: 800;">
                    <span>Promo Code</span>
                    <span style="text-align: center;">Discount</span>
                    <span style="text-align: right;">Action</span>
                </div>
                <ul class="client-list" id="promo-list">
                    <!-- Promo data will be injected here -->
                </ul>
            </div>
        </div>
    </div>

    <script src="js/testimonials.js"></script>
    <script type="module">
        import { db, collection, getDocs, addDoc, serverTimestamp, deleteDoc, doc, onSnapshot, query, orderBy } from './js/firebase-config.js';

        // Global Tab Switcher
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            document.querySelector(`.tab-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if (tabName === 'partners') fetchPartnerApps();
            if (tabName === 'promos') fetchPromos();
        }

        const form = document.getElementById('testi-form');
        const msg = document.getElementById('form-msg');

        // Function to fetch Partner Apps
        async function fetchPartnerApps() {
            const list = document.getElementById('partner-apps-list');
            
            // Listen for real-time updates
            const q = query(collection(db, "partner_applications"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    list.innerHTML = '<p style="text-align: center; opacity: 0.5; padding: 20px;">No applications found.</p>';
                    return;
                }
                
                list.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const app = docSnap.data();
                    const id = docSnap.id;
                    const date = app.createdAt ? new Date(app.createdAt.seconds * 1000).toLocaleDateString() : 'N/A';
                    
                    const div = document.createElement('div');
                    div.className = 'app-item';
                    div.innerHTML = `
                        <div class="app-header">
                            <span class="app-name">${app.name}</span>
                            <span class="app-game">${app.game}</span>
                        </div>
                        <div class="app-detail"><b>Contact:</b> ${app.contact}</div>
                        <div class="app-detail"><b>Portfolio:</b> <a href="${app.portfolio}" target="_blank" class="app-link">View Portfolio</a></div>
                        <div class="app-detail"><b>Reason:</b> ${app.reason}</div>
                        <div class="app-detail" style="font-size: 0.7rem; opacity: 0.5;">Applied on: ${date}</div>
                        <div class="app-actions">
                            <button class="action-btn" style="background: var(--primary); color: black;" onclick="window.copyContact('${app.contact}')">Copy Contact</button>
                            <button class="action-btn btn-delete" onclick="window.deleteApp('${id}')">Remove</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // Function to fetch Promos
        async function fetchPromos() {
            const list = document.getElementById('promo-list');
            const q = query(collection(db, "promo_codes"), orderBy("discount", "asc"));
            onSnapshot(q, (snapshot) => {
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<p style="text-align: center; opacity: 0.5; padding: 20px;">No promo codes active.</p>';
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const li = document.createElement('li');
                    li.className = 'client-item';
                    li.innerHTML = `
                        <span class="client-name" style="font-family: monospace;">${id}</span>
                        <div class="client-badge-col">
                            <span class="discount-badge tier-10">${data.discount}% OFF</span>
                        </div>
                        <div class="client-meta">
                            <div style="display: flex; gap: 5px;">
                                <button class="action-btn" style="background: var(--primary); color: black;" onclick="window.copyCode('${id}')">Copy</button>
                                <button class="action-btn btn-delete" onclick="window.deletePromo('${id}')">Delete</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(li);
                });
            });
        }

        // Helper functions attached to window for onclick access
        window.copyContact = (text) => {
            navigator.clipboard.writeText(text);
            alert('Contact copied to clipboard!');
        }

        window.copyCode = (text) => {
            navigator.clipboard.writeText(text);
            // Custom toast notification style alert could be better, but sticking to alert for consistency
            alert(`Promo code "${text}" copied!`);
        }

        window.deleteApp = async (id) => {
            if (confirm('Are you sure you want to remove this application?')) {
                try {
                    await deleteDoc(doc(db, "partner_applications", id));
                } catch (error) {
                    console.error("Error deleting:", error);
                }
            }
        }

        window.deletePromo = async (id) => {
            if (confirm(`Delete promo code "${id}"?`)) {
                try {
                    await deleteDoc(doc(db, "promo_codes", id));
                } catch (error) {
                    console.error("Error deleting promo:", error);
                }
            }
        }

        // Function to process and render data
        async function processAndRender() {
            console.log("Internal Dashboard: Syncing data...");
            // Start with static data as base
            let combinedData = [...(window.STATIC_TESTIMONIALS || window.testimonialData || [])];
            
            try {
                const querySnapshot = await getDocs(collection(db, "testimonials"));
                const firebaseData = [];
                querySnapshot.forEach((doc) => {
                    firebaseData.push(doc.data());
                });
                
                // Merge without duplicates (using name + game as simple key if needed, or just combine)
                // For the tracker, we just want all of them.
                combinedData = [...firebaseData, ...(window.STATIC_TESTIMONIALS || [])];
            } catch (error) {
                console.error("Error fetching from Firebase:", error);
            }

            const clients = {};
            let totalRevenue = 0;

            combinedData.forEach(item => {
                const numericPrice = parseInt(item.price.toString().replace(/[^0-9]/g, '')) || 0;
                if (!clients[item.name]) clients[item.name] = 0;
                clients[item.name] += numericPrice;
                totalRevenue += numericPrice;
            });

            document.getElementById('total-revenue').textContent = 'Rp ' + totalRevenue.toLocaleString('id-ID');
            document.getElementById('total-clients').textContent = Object.keys(clients).length;

            const sortedClients = Object.entries(clients).sort((a, b) => b[1] - a[1]);
            const list = document.getElementById('client-list');
            list.innerHTML = '';
            
            sortedClients.forEach(([name, total]) => {
                let badgeClass = 'tier-none';
                let badgeText = 'No Discount';

                if (total >= 10000000) { badgeClass = 'tier-30'; badgeText = 'Elite: 30%'; }
                else if (total >= 8000000) { badgeClass = 'tier-20'; badgeText = 'Loyal: 20%'; }
                else if (total >= 5000000) { badgeClass = 'tier-15'; badgeText = 'Regular: 15%'; }
                else if (total >= 3000000) { badgeClass = 'tier-10'; badgeText = 'Member: 10%'; }
                else if (total >= 1000000) { badgeClass = 'tier-5'; badgeText = 'Beginner: 5%'; }

                const li = document.createElement('li');
                li.className = 'client-item';
                li.innerHTML = `
                    <span class="client-name">${name}</span>
                    <div class="client-badge-col">
                        <span class="discount-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <span class="client-total">Rp ${total.toLocaleString('id-ID')}</span>
                `;
                list.appendChild(li);
            });
        }

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'Saving Data...';

            const servicesInput = document.getElementById('services').value;
            const servicesArray = servicesInput.split(',').map(s => s.trim()).filter(s => s !== "");
            const statusValue = parseInt(document.getElementById('status').value);
            const imageUrl = document.getElementById('image-url').value || './assets/preview.png';

            try {
                // Format Harga
                const rawPrice = document.getElementById('price').value.replace(/[^0-9]/g, '');
                const formattedPrice = 'Rp ' + (parseInt(rawPrice) || 0).toLocaleString('id-ID');

                const newTesti = {
                    name: document.getElementById('name').value,
                    game: document.getElementById('game').value,
                    price: formattedPrice,
                    image: imageUrl,
                    service: servicesArray,
                    status: statusValue,
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, "testimonials"), newTesti);
                msg.style.color = '#00ff88';
                msg.innerText = 'Success! Data saved to Firestore.';
                form.reset();
                processAndRender();
            } catch (error) {
                console.error("Error:", error);
                msg.style.color = '#ff4444';
                msg.innerText = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send to Firebase';
            }
        });

        // Promo Form Submission
        document.getElementById('promo-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const codeInput = document.getElementById('promo-code');
            const discountInput = document.getElementById('promo-discount');
            const code = codeInput.value.trim(); // Case sensitive as requested
            const discount = parseInt(discountInput.value);

            if (!code || isNaN(discount)) return;

            try {
                // Use doc() with code as ID to prevent duplicates and make it easy to fetch
                const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                await setDoc(doc(db, "promo_codes", code), {
                    discount: discount,
                    createdAt: serverTimestamp()
                });
                codeInput.value = '';
                discountInput.value = '';
                alert('Promo code added successfully!');
            } catch (error) {
                console.error("Error adding promo:", error);
                alert('Error adding promo code.');
            }
        });

        document.addEventListener('DOMContentLoaded', processAndRender);
    </script>
</body>

</html>
