<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials - Veve Game Services</title>
    <!-- Meta Tags for SEO & Social Media -->
    <meta name="title" content="Testimonials - Veve Game Services">
    <meta name="description" content="Apa kata mereka tentang layanan joki Veve? Cek testimoni pelanggan kami di sini.">
    <meta name="keywords"
        content="joki game, testimoni, boosting service, arknights endfield, wuthering waves, NTE, joki terpercaya, veve services">
    <meta name="author" content="Veve Services">

    <link rel="stylesheet" href="css/index.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon-baru.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/favicon-baru.svg">
    <meta name="theme-color" content="#00f2ff">


    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://venkyarisko.github.io/joki-veve/testimoni.html">
    <meta property="og:title" content="Customer Testimonials - Veve Game Services">
    <meta property="og:description"
        content="Bukti kepuasan pelanggan Veve Game Services. Aman, cepat, dan 100% manual.">
    <meta property="og:image" content="https://venkyarisko.github.io/joki-veve/assets/preview.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://venkyarisko.github.io/joki-veve/testimoni.html">
    <meta property="twitter:title" content="Customer Testimonials - Veve Game Services">
    <meta property="twitter:description"
        content="Bukti kepuasan pelanggan Veve Game Services. Aman, cepat, dan 100% manual.">
    <meta property="twitter:image" content="https://venkyarisko.github.io/joki-veve/assets/preview.png">

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .logo { font-family: 'Outfit', sans-serif; }
    </style>

</head>



<body>
    <canvas id="bg-canvas"></canvas>

    <div id="navbar-placeholder"></div>


    <main id="main-content">
        <header class="section" style="padding-top: 150px; padding-bottom: 20px;">
            <div class="container">
                <div class="section-title" style="margin-bottom: 0;">
                    <span class="hero-badge">Wall of Fame</span>
                    <h1>Customer <span>Testimonials</span></h1>
                    <p style="color: var(--text-muted); max-width: 600px; margin: 20px auto;">Terima kasih atas
                        kepercayaan kalian! Ini adalah beberapa testimoni dari pelanggan yang sudah menggunakan jasa
                        joki Veve.</p>
                </div>
            </div>
        </header>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <!-- Testimonial Tabs -->
                <div class="testi-tabs">
                    <button id="tab-images" class="testi-tab active" onclick="switchTestiTab('images')">
                        <i class="fas fa-images"></i> Bukti Pembayaran
                    </button>
                    <button id="tab-results" class="testi-tab" onclick="switchTestiTab('results')">
                        <i class="fas fa-check-circle"></i> Hasil Kerja
                    </button>
                    <button id="tab-feedback" class="testi-tab" onclick="switchTestiTab('feedback')">
                        <i class="fas fa-star"></i> Real Feedback
                    </button>
                </div>

                <!-- Add Feedback Button for Customers (Moved here) -->
                <div id="add-feedback-cta" style="display: none; text-align: center; margin-bottom: 30px;">
                    <button class="btn-pill" onclick="openFeedbackModal()">
                        <i class="fas fa-plus-circle"></i> Tulis Testimoni Kamu
                    </button>
                </div>

                <div id="testimonial-container" class="testimonial-grid">
                    <!-- Data will be loaded from testimonials.js -->
                </div>

                <div id="results-container" class="results-grid" style="display: none;">
                    <!-- Work results will be loaded here -->
                </div>

                <div id="feedback-container" class="feedback-grid" style="display: none;">
                    <!-- Real Feedback will be loaded here -->
                </div>

                <!-- Pagination -->
                <div id="pagination" class="pagination-container" style="display: none;">
                    <button id="prev-btn" class="pagination-btn" onclick="changePage(-1)">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span id="page-info" class="pagination-info">Page 1 of 1</span>
                    <button id="next-btn" class="pagination-btn" onclick="changePage(1)">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Modal for Lightbox -->
        <div id="lightbox" class="modal" onclick="closeLightbox()">
            <span class="close-modal">&times;</span>
            <div class="modal-gallery-container" onclick="event.stopPropagation()">
                <button id="gallery-prev" class="gallery-nav-btn prev" onclick="changeGalleryImage(-1)">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <img class="modal-content" id="lightbox-img">
                <button id="gallery-next" class="gallery-nav-btn next" onclick="changeGalleryImage(1)">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div id="gallery-counter" class="gallery-counter">1 / 1</div>
            </div>
        </div>

        <!-- Modal for Adding Feedback -->
        <div id="feedback-modal" class="modal">
            <div class="modal-content-form" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h3>Bagikan Pengalamanmu</h3>
                    <span class="close-modal-form" onclick="closeFeedbackModal()">&times;</span>
                </div>
                <form id="customer-feedback-form">
                    <div class="form-group">
                        <label>Nama Kamu</label>
                        <input type="text" id="cust-name" placeholder="Masukin Namamu" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pilih Game</label>
                            <select id="cust-game" required>
                                <option value="" disabled selected>Pilih Game</option>
                                <option value="Arknight Endfield">Arknight Endfield</option>
                                <option value="Wuthering Waves">Wuthering Waves</option>
                                <option value="Neverness to Everness">NTE</option>
                                <option value="custom">Game Lainnya</option>
                            </select>
                        </div>
                        <div class="form-group" id="custom-game-group" style="display: none;">
                            <label>Nama Game</label>
                            <input type="text" id="cust-game-custom" placeholder="Nama Gamenya apa?">
                        </div>
                        <div class="form-group">
                            <label>Jenis Layanan</label>
                            <select id="cust-service" required>
                                <option value="" disabled selected>Pilih Game Dulu</option>
                            </select>
                        </div>
                        <div class="form-group" id="custom-service-group" style="display: none;">
                            <label>Nama Layanan</label>
                            <input type="text" id="cust-service-custom" placeholder="Layanan apa yang kamu gunakan?">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Rating Kamu</label>
                        <div class="rating-input">
                            <input type="radio" name="rating" value="5" id="star5" checked><label for="star5">★</label>
                            <input type="radio" name="rating" value="4" id="star4"><label for="star4">★</label>
                            <input type="radio" name="rating" value="3" id="star3"><label for="star3">★</label>
                            <input type="radio" name="rating" value="2" id="star2"><label for="star2">★</label>
                            <input type="radio" name="rating" value="1" id="star1"><label for="star1">★</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Pesan Testimoni</label>
                        <textarea id="cust-message" placeholder="Ceritakan pengalamanmu menggunakan jasa joki Veve..."
                            rows="4" required></textarea>
                    </div>
                    <button type="submit" id="submit-feedback-btn" class="btn-pill"
                        style="width: 100%; margin-top: 10px;">
                        Kirim Testimoni
                    </button>
                    <div id="feedback-msg" style="margin-top: 15px; text-align: center; font-size: 0.9rem;"></div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>



    <!-- Load Testimonial Data & Logic -->
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/floating-buttons.js"></script>
    <script src="js/testimonials.js"></script>
    <script src="js/activity-ticker.js"></script>
    <script src="js/router.js"></script>
    <script src="js/background-animation.js"></script>
    <script src="js/security.js"></script>

    <!-- Firebase Sync Logic -->
    <script type="module">
        import { db, collection, addDoc, serverTimestamp } from './js/firebase-config.js';
        import { syncFirebaseTestimonials } from './js/firebase-testimonials.js';
        import { GAME_SERVICES } from './js/service-data.js';

        window.openFeedbackModal = () => {
            document.getElementById('feedback-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };

        window.closeFeedbackModal = () => {
            document.getElementById('feedback-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        // Tab sync with CTA visibility
        const originalSwitchTab = window.switchTestiTab;
        window.switchTestiTab = (tab) => {
            if (typeof originalSwitchTab === 'function') originalSwitchTab(tab);
            const cta = document.getElementById('add-feedback-cta');
            if (cta) {
                cta.style.display = tab === 'feedback' ? 'block' : 'none';
            }
        };

        const form = document.getElementById('customer-feedback-form');
        const msg = document.getElementById('feedback-msg');

        const selectGame = document.getElementById('cust-game');
        const selectService = document.getElementById('cust-service');
        const customGameGroup = document.getElementById('custom-game-group');
        const customServiceGroup = document.getElementById('custom-service-group');

        const updateServices = (game) => {
            if (!selectService) return;
            selectService.innerHTML = '<option value="" disabled selected>Pilih Layanan</option>';

            const services = GAME_SERVICES[game] || GAME_SERVICES["Other"];
            services.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                selectService.appendChild(opt);
            });

            const optCustom = document.createElement('option');
            optCustom.value = "custom_service";
            optCustom.textContent = "Lainnya (Custom)";
            selectService.appendChild(optCustom);

            // Hide custom input when changing games
            customServiceGroup.style.display = 'none';
        };

        if (selectGame) {
            selectGame.addEventListener('change', () => {
                const game = selectGame.value;
                customGameGroup.style.display = game === 'custom' ? 'block' : 'none';

                if (game === 'custom') {
                    updateServices("Other");
                } else {
                    updateServices(game);
                }
            });
        }

        if (selectService) {
            selectService.addEventListener('change', () => {
                customServiceGroup.style.display = selectService.value === 'custom_service' ? 'block' : 'none';
            });
        }

        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submit-feedback-btn');
                btn.disabled = true;
                btn.innerText = 'Mengirim...';

                try {
                    const rating = document.querySelector('input[name="rating"]:checked').value;
                    let gameValue = document.getElementById('cust-game').value;
                    if (gameValue === 'custom') {
                        gameValue = document.getElementById('cust-game-custom').value || 'Other Game';
                    }

                    let serviceValue = document.getElementById('cust-service').value;
                    if (serviceValue === 'custom_service') {
                        serviceValue = document.getElementById('cust-service-custom').value || 'Other Service';
                    }

                    const newFeedback = {
                        type: 'feedback',
                        name: document.getElementById('cust-name').value,
                        game: gameValue,
                        service: serviceValue,
                        message: document.getElementById('cust-message').value,
                        rating: parseInt(rating),
                        date: new Date().toISOString().split('T')[0],
                        createdAt: serverTimestamp(),
                        status: 1
                    };

                    await addDoc(collection(db, "testimonials"), newFeedback);

                    msg.style.color = '#00ff88';
                    msg.innerText = 'Terima kasih! Testimoni kamu berhasil dikirim.';
                    form.reset();
                    if (customGameGroup) customGameGroup.style.display = 'none';

                    setTimeout(async () => {
                        closeFeedbackModal();
                        msg.innerText = '';
                        // Silent Refresh: Ambil data terbaru dari Firebase dan render ulang
                        await syncFirebaseTestimonials();
                    }, 2000);

                } catch (error) {
                    console.error("Error:", error);
                    msg.style.color = '#ff4444';
                    msg.innerText = 'Gagal mengirim: ' + error.message;
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Kirim Testimoni';
                }
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=32')
                    .then(reg => console.log('PWA: Service Worker Registered'))
                    .catch(err => console.log('PWA: Service Worker Failed', err));
            });
        }
    </script>
</body>


</html>
